  <meta name="robots" content="noindex">
  <script>
    /* Old WordPress links sometimes used capital letters (e.g. /Moonstone/).
       GitHub Pages is case-sensitive, so send those visitors to the lowercase page. */
    (function () {
      var p = location.pathname, lower = p.toLowerCase();
      if (p !== lower) location.replace(lower + location.search + location.hash);
    })();
  </script>
